<h1>Gestión de Consultorios</h1>
<h2>{{idConsultorio === 0? 'Nuevo Consultorio':'Editar Consultorio'}}</h2>
<form>
    <input
    type="text"
    placeholder="Número"
    name="numero"
    [(ngModel)]="numero">

    <input
    type="text"
    placeholder="Ubicación"
    name="ubicacion"
    [(ngModel)]="ubicacion">

    <input
    type="number"
    placeholder="Piso"
    name="piso"
    [(ngModel)]="piso">

    <label>
        Estado:
        <select name="estado" [(ngModel)]="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
        </select>
    </label>

    <button type="button" (click)="guardar()">
        {{idConsultorio === 0?'Guardar':'Actualizar'}}
    </button>

    <button type="button" (click)="limpiar()">
        Limpiar
    </button>
</form>

<hr>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Ubicación</th>
            <th>Piso</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let Consultorio of consultorios">
            <td>{{Consultorio.idConsultorio}}</td>
            <td>{{Consultorio.numero}}</td>
            <td>{{Consultorio.ubicacion}}</td>
            <td>{{Consultorio.piso}}</td>
            <td>{{Consultorio.estado? 'Activo':'Inactivo'}}</td>
            <td>
                <button type="button" (click)="editar(Consultorio)">Editar</button>
                <button type="button" (click)="eliminar(Consultorio.idConsultorio)">Eliminar</button>
            </td>
        </tr>
    </tbody>
</table>
